<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>Data Explorer</title>

    <link rel="stylesheet" href="/static/grid.css" />
  </head>
  <body class="explorer-page">
    <!-- The Data Explorer popped out of the Workbench into a window of its own (/workbench?panel=explorer,
         explorerPage.ts): the same search; Move back returns it to the Workbench's pane. -->
    <main class="ex-window" id="ex-window"></main>
    <script type="module" src="/static/build/explorer.js"></script>
  </body>
</html>
