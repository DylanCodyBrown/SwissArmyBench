[project]
name = "swissarmybench"
version = "0.0.31"
description = "Local server that shows tabular data in live browser grids."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.12"
# The plain install is the push client only (`import swissarmybench as sab; sab.push(df)`), and it
# needs nothing beyond the standard library, so it can go into any project's environment without
# touching that project's own duckdb or pyarrow. The grid server is the same package with the
# [server] extra, installed once per machine as a uv tool (`uv tool install "<wheel>[server]"`);
# the `swissarmybench` command starts it, and the client only connects. One package, one version.
dependencies = []

[project.optional-dependencies]
server = [
    "duckdb>=1.2",
    # The Workbench's notebooks and scripts run in an IPython kernel (the owner approved both,
    # 2026-11-13): jupyter_client starts and talks to it; ipykernel is the kernel in this Python.
    "ipykernel>=6.29",
    "jupyter_client>=8.6",
    # Blades' secrets (passwords, keys) live in the operating system's vault: Windows Credential
    # Manager, macOS Keychain, the Secret Service on Linux. Never in a blade's file.
    "keyring>=25",
    "mcp>=2.3.0",
    # Excel workbooks (.xlsx), read sheet by sheet in read-only mode.
    "openpyxl>=3.1.5",
    "pyarrow>=19",
    # DuckDB needs it to hand back TIMESTAMP WITH TIME ZONE values (pandas' tz-aware columns): without
    # it every window of such a table fails with "Required module 'pytz' failed to import".
    "pytz>=2024.1",
    # The copy check runs the user's copied code exactly, `.df()` included, and the pandas copy option
    # is a pandas program: without pandas beside the server neither can be verified.
    "pandas>=2.2",
    # The desktop app (the owner, 2026-11-18: "We should just package this as the desktop app pyside6"):
    # Qt for Python with Qt WebEngine (Chromium), LGPLv3, pinned together. Since 6.12 Qt WebEngine is a wheel
    # of its own (WebEngine needs Addons, Addons needs Essentials); the PySide6 meta-package would add
    # PySide6-Pdf, which nothing uses. It replaced the tray's pystray and Pillow.
    "PySide6-Essentials==6.12.0",
    "PySide6-Addons==6.12.0",
    "PySide6-WebEngine==6.12.0.140",
    "sqlglot>=30.24.0",
    "starlette>=0.46",
    "uvicorn>=0.34",
    "websockets>=15",
    "xlsxwriter>=3.3.0",
]
# Optional for the client: with pyarrow a push travels as Arrow and keeps its column types.
client = ["pyarrow>=19"]

[project.scripts]
swissarmybench = "swissarmybench.server.launcher:main"
swissarmybench-mcp = "swissarmybench.mcp.server:main"
sab = "swissarmybench.cli.main:main"
swissarmybench-context = "swissarmybench.client.context_hook:main"
# The old names, for one release (Swiss Army Bench was SwissArmyGrid): each says the new name on stderr,
# then runs it (src/swissarmybench/renamed.py). The next release removes them.
swissarmygrid = "swissarmybench.renamed:swissarmygrid"
swissarmygrid-mcp = "swissarmybench.renamed:swissarmygrid_mcp"
sag = "swissarmybench.renamed:sag"
swissarmygrid-context = "swissarmybench.renamed:swissarmygrid_context"

[dependency-groups]
dev = [
    "swissarmybench[server]",
    "httpx2>=2.16.0",
    "mypy>=1.15",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-playwright>=0.10.0",
    # Parallel test runs (the owner approved it, 2026-11-19): -n 4 for the unit tests, -n 2 for the browser ones.
    "pytest-xdist>=3.8",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# src/swissarmygrid: the old name, a small package that is the new one under it, for one release.
packages = ["src/swissarmybench", "src/swissarmygrid"]

# The plugin installs from the wheel, so the page ships inside it (built by build.py
# with `npm run build:release`, which writes no source maps).
[tool.hatch.build.targets.wheel.force-include]
"web/static" = "swissarmybench/web_static"

[tool.mypy]
strict = true
python_version = "3.12"
# Each extension's own package (extensions/<id>/src) too.
files = ["src", "tests", "examples", "tools", "build.py", "extensions/accounting/src", "extensions/copilot/src", "extensions/powerapps/src", "extensions/streamlit/src", "extensions/git/src", "extensions/powerbi/src"]
mypy_path = "src:extensions/accounting/src:extensions/copilot/src:extensions/powerapps/src:extensions/streamlit/src:extensions/git/src:extensions/powerbi/src"
# The prebuilt widgets are a Streamlit app's code (Streamlit is never the app's dependency): run by AppTest instead.
exclude = ["extensions/streamlit/src/swissarmybench_streamlit/widgets/"]

[[tool.mypy.overrides]]
# These ship no type information.
module = ["pyarrow", "pyarrow.*", "xlsxwriter", "xlsxwriter.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Qt for Python: the Desktop extension's own dependency, installed only with it. Read as Any everywhere,
# so the check is the same with it installed or not.
module = ["PySide6", "PySide6.*", "shiboken6", "shiboken6.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# The Write starters' drivers: imported by the functions for the notebook's own environment, not the app's.
module = ["pyodbc", "pyodbc.*", "mssql_python", "mssql_python.*", "pytds", "pytds.*", "oracledb", "oracledb.*", "trino", "trino.*", "psycopg", "psycopg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The editors' intelligence: Jedi (with IPython) and pyflakes (when the app's Python has it) ship no types.
module = ["jedi", "jedi.*", "pyflakes", "pyflakes.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "extensions/accounting/src", "extensions/copilot/src", "extensions/powerapps/src", "extensions/streamlit/src", "extensions/git/src", "extensions/powerbi/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fixed fake tokens; golden cases hold deliberate Greek letters.
"tests/**" = ["S101", "S105", "S106", "RUF001"]
# These modules build SQL text by design (domain/codegen.py also holds the templates for generated
# code, whose lines are the lines the user will read, hence E501). Every value goes through steps.literal() and every
# name through quote(); no caller text is ever spliced in. S608 cannot see that, so it is off
# here rather than sprinkled as noqa on every line.
"src/swissarmybench/domain/steps.py" = ["S608"]
"src/swissarmybench/adapters/views.py" = ["S608"]
"src/swissarmybench/services/profile.py" = ["S608"]
"src/swissarmybench/domain/charts.py" = ["S608"]
"src/swissarmybench/domain/analysis.py" = ["S608"]
"src/swissarmybench/domain/regression.py" = ["S608"]
"src/swissarmybench/domain/timeseries.py" = ["S608"]
"src/swissarmybench/domain/tieout.py" = ["S608"]
"src/swissarmybench/domain/analysis_facts.py" = ["S608"]
"src/swissarmybench/domain/analysis_fixes.py" = ["S608"]
"src/swissarmybench/domain/diff.py" = ["S608"]
"src/swissarmybench/domain/proofs.py" = ["RUF001", "RUF003"]  # the proofs print real math signs (−, ×, ≤) for people to read
"src/swissarmybench/services/charts.py" = ["S608"]
"src/swissarmybench/domain/codegen.py" = ["S608", "E501"]
# The one-script export holds the exported script's own text (its lines are the lines the user reads).
"src/swissarmybench/domain/script_export.py" = ["E501"]
"src/swissarmybench/domain/script_runtime.py" = ["E501"]
"tests/test_script_export.py" = ["E501"]  # the made-up cells and the lines a script holds, as written
# The Write starters' statements as the databases are sent them (whole T-SQL and SQL lines), the
# messages matched as said, and a test's own folder read back by DuckDB.
"tests/test_starters_write.py" = ["E501", "RUF043", "S608", "RUF012"]
"src/swissarmybench/services/grids.py" = ["S608"]
"src/swissarmybench/services/agent.py" = ["S608"]
"src/swissarmybench/services/export.py" = ["S608"]
# The SQL cell names a connection's files and sheets as DuckDB views: names through _quote(), paths
# through _literal(); the cell's own SQL is the user's, run as they wrote it.
"src/swissarmybench/client/sql_cell.py" = ["S608"]
# The Write starters' helpers build each database's statements by design: every name through name()
# or quote(), every value a bound parameter; the target's own address in urlopen (Dataverse).
"src/swissarmybench/client/write*.py" = ["S608", "S310"]
# The Write starters' functions say each statement in full, names through w.name() and w.table, values
# bound by the helper.
"src/swissarmybench/starters/write_*.blade.py" = ["S310", "E501", "S608"]
# Developer scripts: they run fixed local tools (git, npm, uv, VS Code) with our own arguments,
# set up sys.path before importing, and hold long command lines.
"tools/**" = ["S603", "S607", "S110", "E402", "E501"]
"build.py" = ["S603", "S607"]
# The made-up business: its SQL is built from fixed table names and whole numbers, never a caller's text.
"tools/testbed/large_company.py" = ["S608"]
"tests/test_large_company.py" = ["S608"]
# The packs' viewer cases are kept one per line as a viewer would do them.
"tests/test_widget_packs.py" = ["E501"]
# The starter pack: its Power BI blades reach the REST API at the address their workspace connection holds,
# and a snippet's lines (DAX, HTML, a piece for a Python cell) are kept as the cell will hold them.
"src/swissarmybench/starters/**" = ["S310", "E501"]
# An extension's starters too (their snippets' lines are the lines the user gets).
"extensions/powerapps/src/swissarmybench_powerapps/starters/**" = ["E501"]
"extensions/streamlit/src/swissarmybench_streamlit/starters/**" = ["S310", "E501"]
# The prebuilt widgets: the code a user gets, its markup on one line as written.
"extensions/streamlit/src/swissarmybench_streamlit/widgets/**" = ["S310", "E501"]
"extensions/streamlit/src/swissarmybench_streamlit/commands.py" = ["E501"]
# The command catalog: one-line help prose per command and argument, read by the agent as written.
"src/swissarmybench/cli/commands.py" = ["E501"]
# The Accounting extension: its commands' help prose (as the base's), workbook.py's lines as the user reads
# them, and the builder's queries over the blocks' own tables (every name through _quote; a block's query is
# the user's, run in a DuckDB of its own with no files or network).
"extensions/accounting/src/swissarmybench_accounting/commands.py" = ["E501"]
"extensions/accounting/src/swissarmybench_accounting/exporter.py" = ["E501"]
"extensions/accounting/src/swissarmybench_accounting/runtime.py" = ["S608", "E501"]
"extensions/accounting/src/swissarmybench_accounting/service.py" = ["S608", "E501"]
"extensions/accounting/src/swissarmybench_accounting/extension.py" = ["E501"]
"extensions/git/src/**" = ["E501"]
"tests/test_scm*.py" = ["E501"]
"tests/github_standin.py" = ["E501"]
"tests/test_accounting_*.py" = ["E501", "S603", "S608"]
"tests/test_streamlit_extension.py" = ["E501", "S603", "S607", "RUF012"]
"tests/e2e/test_accounting_page.py" = ["E501", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "medium: a test on the made-up business's medium scale (SWISSARMYBENCH_TEST_MEDIUM=1 runs it)",
    "slow: a long test skipped by default (SWISSARMYBENCH_TEST_SLOW=1 runs it)",
]
