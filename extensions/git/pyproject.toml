[project]
name = "swissarmybench-git"
version = "0.0.24"
description = "Swiss Army Bench's Git extension: GitHub sync for the meta store and shared projects, and the Source Control page."
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
# The base's version, released together (one version line for the base and its extensions).
dependencies = ["swissarmybench[server]==0.0.24"]

# The base finds it here (swissarmybench/extensions.py): its description, rail area, door and commands.
[project.entry-points."swissarmybench.extensions"]
git = "swissarmybench_git.extension"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swissarmybench_git"]
