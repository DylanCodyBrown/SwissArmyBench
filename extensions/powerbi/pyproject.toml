[project]
name = "swissarmybench-powerbi"
# The base's version: the base and its extensions are released together (build.py checks it).
version = "0.0.37"
description = "Swiss Army Bench's Power BI extension: your model as a Power BI Desktop file."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
# pbixray (MIT; the owner's approval, 2026-11-19) reads a .pbix's model measures (never its rows): wheels of it and of
# xpress8, xpress9, xmhuffman and apsw for Python 3.12 on Windows, macOS and Linux (checked on PyPI, 2026-11-19).
# pythonnet (MIT; approved 2026-11-19) drives Microsoft's model client libraries for Edit in Power BI Desktop, on
# Windows only (the libraries themselves are fetched once on first use, pinned and hash checked: never in the wheel).
dependencies = [
    "swissarmybench[server]==0.0.37",
    "pbixray==0.15.5",
    "pythonnet==3.0.5; sys_platform == 'win32'",
]

# How the base finds it (src/swissarmybench/extensions.py): its description, door and commands.
[project.entry-points."swissarmybench.extensions"]
powerbi = "swissarmybench_powerbi.extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swissarmybench_powerbi"]
