[project]
name = "swissarmybench-powerbi"
# The base's version: the base and its extensions are released together (build.py checks it).
version = "0.0.26"
description = "Swiss Army Bench's Power BI extension: your model as a Power BI Desktop file."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = ["swissarmybench[server]==0.0.26"]

# How the base finds it (src/swissarmybench/extensions.py): its description, door and commands.
[project.entry-points."swissarmybench.extensions"]
powerbi = "swissarmybench_powerbi.extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swissarmybench_powerbi"]
