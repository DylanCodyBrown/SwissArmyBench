[project]
name = "swissarmybench-desktop"
# The base's version: the base and its extensions are released together (build.py checks it).
version = "0.0.21"
description = "Swiss Army Bench's Desktop extension: the app in windows of its own (Qt WebEngine) instead of browser tabs."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
# The grid server it plugs into, and Qt for Python with Qt WebEngine (Chromium), LGPLv3: this extension's
# own dependency, never the base's (the owner, 2026-11-18). Since 6.12 Qt WebEngine is a wheel of its own
# (PySide6-WebEngine, which needs PySide6-Addons, which needs PySide6-Essentials); pinned together. The
# PySide6 meta-package would add PySide6-Pdf too, which nothing here uses.
dependencies = [
    "swissarmybench[server]==0.0.21",
    "PySide6-Essentials==6.12.0",
    "PySide6-Addons==6.12.0",
    "PySide6-WebEngine==6.12.0.140",
]

# How the base finds it (src/swissarmybench/extensions.py): its description, its hooks, door and commands.
[project.entry-points."swissarmybench.extensions"]
desktop = "swissarmybench_desktop.extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swissarmybench_desktop"]
